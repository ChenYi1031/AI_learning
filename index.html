<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI Agent 概念学习中心：大模型基础、Agent 核心、RAG 与开发框架的可视化概念图鉴">
  <title>AI Agent 概念学习中心</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 顶部导航栏 -->
  <header class="navbar">
    <div class="nav-inner">
      <a class="brand" href="./">
        <span class="brand-logo">AI</span>
        <span class="brand-text">AI Agent 概念学习中心</span>
      </a>
      <div class="search-box">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.5" y2="16.5"></line>
        </svg>
        <input id="searchInput" type="search" autocomplete="off"
               placeholder="搜索概念，如 Transformer / RAG / 记忆 …">
      </div>
      <span class="count-badge" id="countBadge" title="当前显示的概念数量">0</span>
    </div>
  </header>

  <!-- 视图切换 -->
  <nav class="view-tabs" id="viewTabs">
    <div class="view-tabs-inner">
      <button class="view-tab active" data-view="concepts">📖 概念图鉴</button>
      <button class="view-tab" data-view="projects">🛠️ 实战项目</button>
      <button class="view-tab" data-view="paper">📜 论文精读</button>
    </div>
  </nav>

  <!-- 分类过滤栏 -->
  <nav class="filter-bar" id="filterBarWrap">
    <div class="filter-inner" id="filterBar"></div>
  </nav>

  <!-- 概念卡片网格 -->
  <main class="main">
    <div id="grid" class="grid" aria-live="polite"></div>
    <div id="tutorialList" class="tutorial-list" hidden></div>
    <div id="empty" class="empty" hidden>
      <div class="empty-icon">🔍</div>
      <p>没有找到匹配的概念</p>
      <p class="empty-hint">换个关键词试试，或点击上方分类查看全部内容</p>
    </div>
  </main>

  <footer class="footer">
    <p>AI Agent 概念学习中心 · 数据来自 <code>concepts.json</code> · 由 GitHub Pages 驱动</p>
  </footer>

  <!-- 详情模态框 -->
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" aria-label="关闭">&times;</button>
      <div class="modal-img-wrap">
        <img id="modalImg" alt="">
      </div>
      <div class="modal-body">
        <span class="tag" id="modalTag"></span>
        <h2 id="modalTitle"></h2>
        <div id="modalBody"></div>
      </div>
    </div>
  </div>

  <!-- 教程阅读器 -->
  <div class="reader-backdrop" id="readerBackdrop" hidden>
    <article class="reader" role="article">
      <button class="reader-close" id="readerClose" aria-label="关闭">&times;</button>
      <div id="readerContent"></div>
    </article>
  </div>

  <script src="script.js"></script>
</body>
</html>
